name: aeroops-local

services:
  postgres:
    image: postgres:17-alpine
    container_name: aeroops-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aeroops_local
      POSTGRES_USER: aeroops_local
      POSTGRES_PASSWORD: aeroops_local_password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - aeroops-local-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroops_local -d aeroops_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aeroops-local-postgres-data:
